name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Cardroid.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Cardroid-apk
          path: Cardroid.apk

      # main publishes the stable download; any other branch publishes a test build.
      - name: Publish APK (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Cardroid (última versión)
          files: Cardroid.apk
          make_latest: true

      - name: Publish APK (test build)
        if: github.ref != 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          target_commitish: ${{ github.sha }}
          name: Cardroid (versión de prueba)
          prerelease: true
          files: Cardroid.apk
